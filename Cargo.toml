[workspace]
members = ["crates/config-core", "crates/config-cli", "crates/config-tui", "apps/gui/rust"]
default-members = ["crates/config-core", "crates/config-cli", "crates/config-tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
strip = "debuginfo"

