name: codex_configurator
description: A schema-driven Codex configuration editor for desktop.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  file_selector: 1.1.0
  fluent_ui: 4.16.1
  macos_ui: 2.2.2
  shared_preferences: 2.5.6
  yaru: 11.0.0

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

